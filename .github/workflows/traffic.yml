name: Repository traffic

on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: write

concurrency:
  group: repository-traffic
  cancel-in-progress: false

jobs:
  repositories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check out Traffic to Badge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: yi-Xu-0100/traffic-to-badge
          ref: 6e7656202ad370afe7e80465c32ee367324ab4fc # v1.4.0
          path: .traffic-action
          persist-credentials: false

      - name: Store per-repository history under traffic
        shell: python
        run: |
          from pathlib import Path
          bundle = Path('.traffic-action/dist/index.js')
          source = bundle.read_text()
          old = 'join(traffic_branch_path, `traffic-${static_list[i]}`)'
          new = 'join(traffic_branch_path, "traffic", static_list[i])'
          assert source.count(old) == 1, 'Upstream traffic path changed'
          bundle.write_text(source.replace(old, new))

      - name: Collect repository traffic
        uses: ./.traffic-action
        with:
          my_token: ${{ secrets.TRAFFIC_TOKEN }}
          static_list: Satellite-OSS/SatellitePaper,Satellite-OSS/SatelliteDataset,Satellite-OSS/SatelliteResource,Satellite-OSS/SatelliteOperatingSystem,Satellite-OSS/SoftwareEvaluationPlatform,Satellite-OSS/ApplicationSoftwareCode
          traffic_branch: main

      - name: Generate combined repository views badge
        shell: python
        run: |
          import json
          from pathlib import Path
          total = sum(json.loads(p.read_text())['count']
                      for p in Path('.main/traffic').glob('*/traffic_views.json'))
          badge = {'schemaVersion': 1, 'label': 'Repo views',
                   'message': str(total), 'color': 'brightgreen'}
          Path('.main/traffic/repo-views.json').write_text(json.dumps(badge, indent=2) + '\n')

      - name: Save traffic data and badges
        shell: bash
        run: |
          # Publish repository histories and the combined badge from the temporary clone.
          mkdir -p traffic
          cp -R .main/traffic/. traffic/
          git add traffic
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update repository traffic'
          git pull --rebase origin main
          git push origin HEAD:main
