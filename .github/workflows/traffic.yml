name: Repository traffic

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: write

concurrency:
  group: repository-traffic
  cancel-in-progress: false

jobs:
  repositories:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check out github-repo-stats
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: jgehrcke/github-repo-stats
          ref: ff48771cbb4324c3b77490bbfc26d6a5f3831cdb
          path: .github-repo-stats
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install upstream dependencies
        run: |
          # Upstream pandas 2.1.1 requires the NumPy 1.x binary ABI.
          python -m pip install 'numpy<2' 'carbonplan-styles==0.4.2' 'matplotlib<3.9' -r .github-repo-stats/requirements-fa.txt
          sudo apt-get update -qq
          sudo apt-get install -y pandoc

      - name: Collect and aggregate repository traffic
        env:
          GHRS_GITHUB_API_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        shell: bash
        run: |
          for aggregate in traffic/*.csv; do
            [ "$aggregate" = traffic/sum.csv ] && continue
            repository="Satellite-OSS/$(basename "$aggregate" .csv)"
            scratch=$(mktemp -d)
            python .github-repo-stats/fetch.py "$repository" --snapshot-directory "$scratch/snapshots"
            python .github-repo-stats/analyze.py "$repository" "$scratch/snapshots" \
              --resources-directory .github-repo-stats/resources \
              --output-directory "$scratch/report" \
              --views-clones-aggregate-inpath "$aggregate" \
              --views-clones-aggregate-outpath "$aggregate"
          done

      - name: Generate repository and community badges
        run: |
          python -B scripts/test_traffic_badges.py
          python scripts/traffic-badges.py

      - name: Commit changed statistics only
        shell: bash
        run: |
          git add traffic
          if git diff --cached --quiet; then
            echo 'Statistics unchanged; no commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update repository traffic'
          git pull --rebase origin main
          git push origin HEAD:main
